# VPS'da nginx allaqachon bo'lsa (Caddy o'rniga): Mini App statik fayllari +
# /api → Go API (docker, 127.0.0.1:HTTP_PORT). HTTPS'ni certbot qo'shadi:
#   cp build/nginx/dehqonbobo.binary.uz.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/dehqonbobo.binary.uz.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dehqonbobo.binary.uz
# API'da TRUST_PROXY=true bo'lishi shart (X-Real-IP dan mijoz IP'si).

server {
    listen 80;
    listen [::]:80;
    server_name dehqonbobo.binary.uz;

    # make webapp-build natijasi
    root /opt/dehqon-bobo/webapp/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        client_max_body_size 1m;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8091;
    }

    # Fayl nomida hash bor — abadiy keshlanadi.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Yangi versiya darhol ko'rinsin.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: noma'lum yo'llar index.html ga.
    location / {
        try_files $uri /index.html;
    }
}
