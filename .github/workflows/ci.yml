name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt kerak:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runner'da Docker bor: testcontainers Postgres/Redis'ni o'zi ko'taradi.
      - name: Integration tests
        run: go test -tags=integration -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f build/api/Dockerfile -t dehqon-bobo/api:${{ github.sha }} .
      - name: Build web image (Mini App + Caddy)
        run: docker build -f build/web/Dockerfile -t dehqon-bobo/web:${{ github.sha }} .
      - name: Compose config
        run: |
          cp .env.example .env
          sed -i 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' .env
          docker compose --profile app config -q

  webapp:
    name: Mini App (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
