services:
  postgres:
    image: postgres:17-alpine
    container_name: dehqon_postgres
    restart: unless-stopped # kompyuter o'chib yonsa, o'zi qayta ishga tushadi
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dehqon_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD bosh bolmasligi kerak}
      --save 60 1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- ilova: `docker compose --profile app up -d --build` (make up-app) ----
  # Profil sababli oddiy `make up` avvalgidek faqat Postgres + Redis ko'taradi
  # (lokal `go run` uchun).

  # Migratsiyalar API'dan OLDIN, alohida bir martalik konteynerda: API bir
  # nechta nusxada ishlasa ham sxema bir marta yangilanadi.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    # Parolda URL uchun maxsus belgilar (@ : / ? #) bo'lmasin — DSN buziladi.
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: .
      dockerfile: build/api/Dockerfile
    image: dehqon-bobo/api:local
    container_name: dehqon_api
    profiles: ["app"]
    restart: unless-stopped
    # Boshqa muhit uchun: ENV_FILE=.env.staging make up-app
    env_file: ${ENV_FILE:-.env}
    # Konteyner tarmog'ida xizmatlar nomi va ichki portlari bilan; .env dagi
    # DB_PORT / REDIS_PORT / HTTP_PORT — host'ga chiqarilgan portlar.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8087}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /readyz Postgres va Redis'ni ham tekshiradi. wget — alpine busybox.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Mini App (statik) + reverse proxy. SITE_ADDRESS domen bo'lsa — HTTPS.
  web:
    build:
      context: .
      dockerfile: build/web/Dockerfile
    image: dehqon-bobo/web:local
    container_name: dehqon_web
    profiles: ["app"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
      - "${WEB_BIND:-127.0.0.1}:${WEB_TLS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
